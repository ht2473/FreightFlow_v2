name: ffv2-dev

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: freightflow/postgres:18-3.6
    environment:
      POSTGRES_USER: freightflow
      POSTGRES_PASSWORD: freightflow
      POSTGRES_DB: freightflow
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_wal_size=2GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - shared_buffers=512MB
    ports:
      - "55442:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightflow -d freightflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "8035:8025"
      - "1035:1025"

  # Фоновые задачи с инструментами OSM (osm2pgsql, osmium, gdal): task etl:up / task etl:run.
  # Бинарник подключается из bin/linux — после изменений кода достаточно task build:linux.
  # Запускается копия: Docker Desktop кеширует исполняемые страницы файла по пути, и
  # пересобранный бинарник, запущенный напрямую из общего каталога, может падать.
  worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    image: freightflow/worker:dev
    profiles: ["etl"]
    entrypoint: ["/bin/sh", "-c", "cp /opt/freightflow/freightflow /tmp/freightflow && exec /tmp/freightflow \"$$@\"", "--"]
    # entrypoint сбрасывает CMD образа.
    command: ["worker"]
    env_file: ../.env
    environment:
      FF_DATABASE_URL: postgres://freightflow:freightflow@db:5432/freightflow?sslmode=disable
      FF_DATA_DIR: /data
      FF_RU_CA_FILE: /data/certs/russian_trusted_root_ca.pem
      FF_WORKER_METRICS_ADDR: 0.0.0.0:9091
      FF_VALHALLA_URL: http://routing:8002
      HTTP_PROXY: ${FF_DOCKER_HTTP_PROXY:-}
      HTTPS_PROXY: ${FF_DOCKER_HTTP_PROXY:-}
      NO_PROXY: db,routing,localhost,127.0.0.1
    volumes:
      - ../var:/data
      - ../bin/linux:/opt/freightflow:ro
    depends_on:
      db:
        condition: service_healthy

  # Маршрутизация: граф из var/routing/current (task routing:build), служба — task routing:up.
  routing:
    image: ghcr.io/valhalla/valhalla:3.9.1
    profiles: ["routing"]
    entrypoint: ["valhalla_service", "/custom_files/current/valhalla.json", "4"]
    ports:
      - "8002:8002"
    volumes:
      - ../var/routing:/custom_files
      - ./valhalla:/opt/valhalla:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 5

  pdf:
    image: chromedp/headless-shell:stable
    profiles: ["pdf"]
    ports:
      - "9222:9222"

volumes:
  pgdata:
