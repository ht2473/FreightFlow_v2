name: ffv2-dev

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: freightflow/postgres:18-3.6
    environment:
      POSTGRES_USER: freightflow
      POSTGRES_PASSWORD: freightflow
      POSTGRES_DB: freightflow
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_wal_size=2GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - shared_buffers=512MB
    ports:
      - "55442:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightflow -d freightflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "8035:8025"
      - "1035:1025"

  routing:
    image: ghcr.io/valhalla/valhalla:3.9.1
    profiles: ["routing"]
    ports:
      - "8002:8002"
    volumes:
      - ../var/routing:/custom_files

  pdf:
    image: chromedp/headless-shell:stable
    profiles: ["pdf"]
    ports:
      - "9222:9222"

volumes:
  pgdata:
