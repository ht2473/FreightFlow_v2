openapi: 3.0.3
info:
  title: FreightFlow API
  version: 1.0.0
  description: |
    Программный интерфейс системы мониторинга и анализа логистической инфраструктуры Москвы.
    Доступ — по сессии браузера или по токену (`Authorization: Bearer <токен>`).
    Право доступа операции указано в расширении `x-permission`; `authenticated` — любой вошедший
    пользователь.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: me
    description: Текущий пользователь
  - name: admin
    description: Администрирование
  - name: data
    description: Источники данных и загрузки
  - name: layers
    description: Слои карты
  - name: regulation
    description: Регулирование грузового движения
  - name: routing
    description: Маршруты грузовиков с учётом ограничений и зон

paths:
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Текущий пользователь и его права
      x-permission: authenticated
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Изменить имя
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfile" }
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }

  /me/settings:
    get:
      tags: [me]
      operationId: getSettings
      summary: Личные настройки
      x-permission: authenticated
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [me]
      operationId: updateSettings
      summary: Сохранить личные настройки
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Problem" }

  /me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Сменить пароль
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePassword" }
      responses:
        "204": { description: Пароль изменён }
        default: { $ref: "#/components/responses/Problem" }

  /me/totp:
    post:
      tags: [me]
      operationId: beginTotpSetup
      summary: Начать подключение двухфакторной защиты
      x-permission: authenticated
      responses:
        "200":
          description: Секрет и ссылка для приложения-аутентификатора
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [me]
      operationId: disableTotp
      summary: Отключить двухфакторную защиту
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "204": { description: Отключено }
        default: { $ref: "#/components/responses/Problem" }

  /me/totp/confirm:
    post:
      tags: [me]
      operationId: confirmTotp
      summary: Подтвердить подключение кодом из приложения
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: Резервные коды (показываются один раз)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Problem" }

  /me/tokens:
    get:
      tags: [me]
      operationId: listTokens
      summary: Токены API пользователя
      x-permission: tokens.own
      responses:
        "200":
          description: Токены
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [me]
      operationId: createToken
      summary: Выпустить токен API
      x-permission: tokens.own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToken" }
      responses:
        "201":
          description: Токен; значение показывается один раз
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        default: { $ref: "#/components/responses/Problem" }

  /me/tokens/{tokenId}:
    delete:
      tags: [me]
      operationId: revokeToken
      summary: Отозвать токен
      x-permission: tokens.own
      parameters:
        - $ref: "#/components/parameters/TokenId"
      responses:
        "204": { description: Отозван }
        default: { $ref: "#/components/responses/Problem" }

  /permissions:
    get:
      tags: [me]
      operationId: listPermissions
      summary: Справочник прав
      x-permission: authenticated
      responses:
        "200":
          description: Права
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PermissionInfo" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Пользователи
      x-permission: users.manage
      responses:
        "200":
          description: Пользователи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      operationId: createUser
      summary: Создать пользователя
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "201":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/users/{userId}:
    get:
      tags: [admin]
      operationId: getUser
      summary: Пользователь
      x-permission: users.manage
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [admin]
      operationId: updateUser
      summary: Изменить имя, роли или статус
      x-permission: users.manage
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/users/{userId}/totp:
    delete:
      tags: [admin]
      operationId: resetUserTotp
      summary: Сбросить двухфакторную защиту пользователя
      x-permission: users.manage
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Сброшено }
        default: { $ref: "#/components/responses/Problem" }

  /admin/invites:
    post:
      tags: [admin]
      operationId: createInvite
      summary: Пригласить пользователя
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvite" }
      responses:
        "201":
          description: Приглашение отправлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: Роли и права
      x-permission: users.manage
      responses:
        "200":
          description: Роли
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/audit:
    get:
      tags: [admin]
      operationId: listAudit
      summary: Журнал аудита
      x-permission: audit.view
      parameters:
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: cursor
          in: query
          description: Идентификатор последней записи предыдущей страницы
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Страница записей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default: { $ref: "#/components/responses/Problem" }

  /layers:
    get:
      tags: [layers]
      operationId: listLayers
      summary: Каталог слоёв карты, доступных пользователю
      description: |
        Слои в порядке отрисовки снизу вверх с адресами тайлов текущей версии данных,
        правилами оформления (роли токенов дизайна) и описанием свойств объектов.
      x-permission: map.view
      responses:
        "200":
          description: Каталог
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerCatalog" }
        default: { $ref: "#/components/responses/Problem" }

  /data/sources:
    get:
      tags: [data]
      operationId: listSources
      summary: Источники данных со свежестью и последним запуском
      x-permission: data.manage
      responses:
        "200":
          description: Источники
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceInfo" }
        default: { $ref: "#/components/responses/Problem" }

  /data/sources/{code}:
    patch:
      tags: [data]
      operationId: updateSource
      summary: Включить или выключить загрузку по расписанию
      x-permission: data.manage
      parameters:
        - $ref: "#/components/parameters/SourceCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSource" }
      responses:
        "200":
          description: Источник
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceInfo" }
        default: { $ref: "#/components/responses/Problem" }

  /data/sources/{code}/runs:
    get:
      tags: [data]
      operationId: listRuns
      summary: Запуски источника
      x-permission: data.manage
      parameters:
        - $ref: "#/components/parameters/SourceCode"
        - name: before
          in: query
          description: Время постановки последнего запуска предыдущей страницы
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Запуски от новых к старым
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [data]
      operationId: startRun
      summary: Запустить загрузку
      x-permission: data.manage
      parameters:
        - $ref: "#/components/parameters/SourceCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRun" }
      responses:
        "202":
          description: Запуск поставлен в очередь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /data/runs/{runId}:
    get:
      tags: [data]
      operationId: getRun
      summary: Запуск с журналом и проверками качества
      x-permission: data.manage
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Запуск
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        default: { $ref: "#/components/responses/Problem" }

  /regulation:
    get:
      tags: [regulation]
      operationId: getRegulation
      summary: Зоны ограничения, правила с правовыми основаниями, документы, грузовой каркас
      description: |
        Правила зон СК, ТТК и МКАД сверены с правовыми актами и официальными страницами
        Дептранса; неподтверждённые правила отмечены `confirmed: false`. Страницы, изменившиеся
        после сверки, отмечены `changedSinceVerification`.
      x-permission: map.view
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegulationOverview" }
        default: { $ref: "#/components/responses/Problem" }

  /regulation/passes:
    get:
      tags: [regulation]
      operationId: getPassStats
      summary: Пропуска грузового транспорта по месяцам, зонам и сериям
      description: Только агрегаты; номера пропусков и сведения о ТС не хранятся.
      x-permission: map.view
      responses:
        "200":
          description: Ряды по месяцам
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassStats" }
        default: { $ref: "#/components/responses/Problem" }

  /regulation/permits:
    get:
      tags: [regulation]
      operationId: getPermitStats
      summary: Спецразрешения на тяжеловесные и крупногабаритные ТС по месяцам и видам
      x-permission: map.view
      responses:
        "200":
          description: Ряды по месяцам
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermitStats" }
        default: { $ref: "#/components/responses/Problem" }

  /regulation/signs:
    get:
      tags: [regulation]
      operationId: getSignQuality
      summary: Отчёт качества дорожных знаков ограничений и расхождений с OSM
      description: |
        Знаки ограничений из реестра Москвы: сколько привязано к участкам сети, неоднозначно
        или не привязано, по видам знаков; ограничения, полученные из знаков; расхождения с
        разметкой OSM по видам ограничений.
      x-permission: map.view
      responses:
        "200":
          description: Отчёт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignQuality" }
        default: { $ref: "#/components/responses/Problem" }

  /routing/profiles:
    get:
      tags: [routing]
      operationId: listVehicleProfiles
      summary: Типовые профили ТС
      x-permission: routing.use
      responses:
        "200":
          description: Профили
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VehicleProfile" }
        default: { $ref: "#/components/responses/Problem" }

  /routing/route:
    post:
      tags: [routing]
      operationId: buildRoute
      summary: Маршрут грузовика с политикой зон и объяснением обходов
      description: |
        Зоны, закрытые для ТС (масса, экологический класс, пропуска, время отправления),
        исключаются из маршрута. Для сравнения строится путь легкового автомобиля без
        ограничений; ответ перечисляет ограничения и зоны на нём, которых маршрут избегает. Если
        точка маршрута лежит в закрытой зоне, маршрут не строится — `blocked` не пуст.
      x-permission: routing.use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteRequest" }
      responses:
        "200":
          description: Маршрут и объяснение
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteResult" }
        default: { $ref: "#/components/responses/Problem" }

  /routing/isochrone:
    post:
      tags: [routing]
      operationId: buildIsochrone
      summary: Изохроны доступности для грузовика
      description: |
        Контуры территории, достижимой за заданное время, с исключением зон, закрытых для ТС.
        Если точка отправления в закрытой зоне, контуры не строятся — `blocked` заполнен.
      x-permission: routing.use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IsochroneRequest" }
      responses:
        "200":
          description: Контуры и решения по зонам
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IsochroneResult" }
        default: { $ref: "#/components/responses/Problem" }

  /routing/matrix:
    post:
      tags: [routing]
      operationId: buildMatrix
      summary: Матрица времени и расстояния грузовика
      description: |
        Время и расстояние от каждого источника до каждой цели (не более 2 500 пар) с исключением
        зон, закрытых для ТС. Точки в закрытой зоне в расчёт не входят: их ячейки пусты, точки
        перечислены в `blockedSources` и `blockedTargets`.
      x-permission: routing.use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatrixRequest" }
      responses:
        "200":
          description: Матрица и решения по зонам
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatrixResult" }
        default: { $ref: "#/components/responses/Problem" }

  /routing/status:
    get:
      tags: [routing]
      operationId: getRoutingStatus
      summary: Состояние службы маршрутизации и графа
      x-permission: routing.use
      responses:
        "200":
          description: Состояние
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingStatus" }
        default: { $ref: "#/components/responses/Problem" }

  /routing/analysis:
    get:
      tags: [routing]
      operationId: getNetworkAnalysis
      summary: Сетевой анализ — значимость участков, узкие места, критичные мосты и участки
      description: |
        Текущая версия графа анализа для профиля 12 т: состав, точность выборочной оценки
        центральности, улицы с наибольшей значимостью, узкие места по значимости путей, мосты и
        участки по росту времени доступа объектов к МКАД при закрытии.
      x-permission: analytics.view
      parameters:
        - name: top
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkAnalysis" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ff_session
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    SourceCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]*$", maxLength: 64 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Ошибка (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    Me:
      type: object
      required: [id, email, name, roles, permissions, totpEnabled]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        totpEnabled: { type: boolean }

    UpdateProfile:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    Settings:
      type: object
      required: [theme]
      properties:
        theme:
          type: string
          enum: [light, dark, system]

    ChangePassword:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }

    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128 }

    TotpSetup:
      type: object
      required: [secret, url]
      properties:
        secret: { type: string }
        url: { type: string }

    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 11 }

    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }

    PermissionInfo:
      type: object
      required: [code, title]
      properties:
        code: { type: string }
        title: { type: string }

    ApiToken:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }

    CreateToken:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
        expiresAt: { type: string, format: date-time }

    CreatedToken:
      type: object
      required: [token, value]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        value: { type: string }

    User:
      type: object
      required: [id, email, name, status, roles, totpEnabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [active, blocked]
        roles:
          type: array
          items: { type: string }
        totpEnabled: { type: boolean }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    CreateUser:
      type: object
      required: [email, name, password, roles]
      properties:
        email: { type: string, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 128 }
        roles:
          type: array
          minItems: 1
          items: { type: string }

    UpdateUser:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        roles:
          type: array
          minItems: 1
          items: { type: string }
        status:
          type: string
          enum: [active, blocked]

    CreateInvite:
      type: object
      required: [email, role]
      properties:
        email: { type: string, maxLength: 254 }
        role: { type: string }

    InviteCreated:
      type: object
      required: [email, expiresInHours]
      properties:
        email: { type: string }
        expiresInHours: { type: integer }

    Role:
      type: object
      required: [code, name, description, builtin, permissions]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        builtin: { type: boolean }
        permissions:
          type: array
          items: { type: string }

    AuditRecord:
      type: object
      required: [id, at, actorLabel, action, entityType, entityId, details]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorId: { type: string, format: uuid }
        actorLabel: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        ip: { type: string }
        userAgent: { type: string }
        details:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditRecord" }
        nextCursor: { type: string, format: uuid }

    SourceInfo:
      type: object
      required: [code, title, publisher, url, license, attribution, domains, ruNetwork, enabled, freshness]
      properties:
        code: { type: string }
        title: { type: string }
        publisher: { type: string }
        url: { type: string }
        license: { type: string }
        attribution: { type: string }
        domains:
          type: array
          items: { type: string }
        intervalSeconds:
          type: integer
          description: Период загрузки по расписанию; нет — только вручную
        ruNetwork:
          type: boolean
          description: Российский государственный ресурс (прямое соединение)
        enabled: { type: boolean }
        lastRun: { $ref: "#/components/schemas/Run" }
        lastSuccessAt: { type: string, format: date-time }
        recordCount: { type: integer, format: int64 }
        freshness:
          type: string
          enum: [fresh, stale, never]
          description: fresh — загружено в срок; stale — пропущено больше двух периодов; never — ни одной успешной загрузки

    UpdateSource:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    StartRun:
      type: object
      properties:
        force:
          type: boolean
          description: Загрузить, даже если снимок не изменился

    Run:
      type: object
      required: [id, source, status, trigger, forced, queuedAt, stats]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, unchanged, failed]
        trigger:
          type: string
          enum: [schedule, manual, cli]
        forced: { type: boolean }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        stats:
          type: object
          additionalProperties: { type: integer, format: int64 }
        error: { type: string }

    RunDetail:
      type: object
      required: [run, log, checks]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        log:
          type: array
          items: { $ref: "#/components/schemas/RunLogEntry" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/QualityCheck" }

    RunLogEntry:
      type: object
      required: [at, level, message]
      properties:
        at: { type: string, format: date-time }
        level:
          type: string
          enum: [info, warn]
        message: { type: string }

    QualityCheck:
      type: object
      required: [code, title, severity, passed, checkedAt]
      properties:
        code: { type: string }
        title: { type: string }
        severity:
          type: string
          enum: [info, warning, critical]
        passed: { type: boolean }
        observed: {}
        expected: {}
        message: { type: string }
        checkedAt: { type: string, format: date-time }

    LayerCatalog:
      type: object
      required: [groups, layers]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/LayerGroup" }
        layers:
          type: array
          items: { $ref: "#/components/schemas/MapLayer" }

    LayerGroup:
      type: object
      required: [code, title]
      properties:
        code: { type: string }
        title: { type: string }

    MapLayer:
      type: object
      required: [code, group, title, description, geometry, minzoom, maxzoom, tiles, version, attribution, visible, style, properties]
      properties:
        code: { type: string }
        group: { type: string }
        title: { type: string }
        description: { type: string }
        geometry:
          type: string
          enum: [point, line, polygon]
        minzoom: { type: integer }
        maxzoom: { type: integer }
        tiles:
          type: string
          description: Шаблон адреса тайлов с версией данных ({z}/{x}/{y})
        version: { type: string }
        attribution: { type: string }
        visible:
          type: boolean
          description: Включён по умолчанию
        style: { $ref: "#/components/schemas/LayerStyle" }
        properties:
          type: array
          items: { $ref: "#/components/schemas/LayerProperty" }

    LayerStyle:
      type: object
      required: [kind, categories]
      properties:
        kind:
          type: string
          enum: [single, category]
        color:
          type: string
          description: Роль токена цвета (acc, n9…n12, ok, warn, crit, info, cat1…cat8)
        property:
          type: string
          description: Свойство, по значению которого выбирается цвет
        dashedBy:
          type: string
          description: Логическое свойство, при котором линия пунктирная
        note:
          type: string
          description: Пояснение к легенде
        categories:
          type: array
          items: { $ref: "#/components/schemas/LayerCategory" }

    LayerCategory:
      type: object
      required: [values, label, color]
      properties:
        values:
          type: array
          items: { type: string }
        label: { type: string }
        color: { type: string }

    LayerProperty:
      type: object
      required: [name, title, kind]
      properties:
        name: { type: string }
        title: { type: string }
        kind:
          type: string
          enum: [text, number, bool, enum]
        unit: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }

    RegulationOverview:
      type: object
      required: [zones, rules, documents, pages, cargoFrame]
      properties:
        zones:
          type: array
          items: { $ref: "#/components/schemas/RingZone" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/ZoneRule" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/LegalDocument" }
        pages:
          type: array
          items: { $ref: "#/components/schemas/OfficialPage" }
        cargoFrame: { $ref: "#/components/schemas/CargoFrame" }

    RingZone:
      type: object
      required: [code, name, lengthKm]
      properties:
        code:
          type: string
          enum: [sk, ttk, mkad]
        name: { type: string }
        lengthKm: { type: number }
        areaKm2: { type: number }

    ZoneRule:
      type: object
      required: [code, zone, title, effect, passZones, document, confirmed]
      properties:
        code: { type: string }
        zone:
          type: string
          enum: [sk, ttk, mkad]
          description: Зона — территория внутри кольца вместе с самим кольцом
        title: { type: string }
        effect:
          type: string
          enum: [prohibited, pass_required, frame_only]
          description: prohibited — въезд запрещён; pass_required — нужен пропуск; frame_only — вне грузового каркаса только обслуживание района
        massBasis:
          type: string
          enum: [gross, payload]
          description: gross — разрешённая максимальная масса; payload — грузоподъёмность
        massOverT:
          type: number
          description: Правило касается ТС тяжелее порога, т
        ecoClassMin:
          type: integer
          description: Правило касается ТС с экологическим классом ниже указанного
        timeFrom:
          type: string
          description: Начало действия (ЧЧ:ММ); интервал может переходить через полночь; нет — круглосуточно
        timeTo: { type: string }
        passKind:
          type: string
          enum: [day, night]
        passZones:
          type: array
          description: Зоны пропусков, дающих право проезда
          items: { type: string }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        document:
          type: string
          description: Код правового основания (LegalDocument)
        clause: { type: string }
        confirmed: { type: boolean }
        confirmedBy:
          type: string
          description: Код документа, по которому правило подтверждено
        note: { type: string }

    LegalDocument:
      type: object
      required: [code, kind, title, authority, status]
      properties:
        code: { type: string }
        kind:
          type: string
          enum: [act, amendment, page]
        title: { type: string }
        number: { type: string }
        signedOn: { type: string, format: date }
        effectiveOn: { type: string, format: date }
        authority: { type: string }
        url: { type: string }
        status:
          type: string
          enum: [in_force, repealed, info]
        amends: { type: string }
        summary: { type: string }
        verifiedOn: { type: string, format: date }

    OfficialPage:
      type: object
      required: [code, title, url, fetchedAt, changedAt, changedSinceVerification]
      properties:
        code: { type: string }
        title: { type: string }
        url: { type: string }
        fetchedAt: { type: string, format: date-time }
        changedAt: { type: string, format: date-time }
        changedSinceVerification: { type: boolean }

    CargoFrame:
      type: object
      required: [streets, matched, partial, lengthKm, okrugs]
      properties:
        streets: { type: integer }
        matched:
          type: integer
          description: Улиц перечня, найденных в дорожной сети
        partial:
          type: integer
          description: Строк перечня с участком улицы
        lengthKm: { type: number }
        updatedAt: { type: string, format: date-time }
        okrugs:
          type: array
          items: { $ref: "#/components/schemas/CargoFrameOkrug" }

    CargoFrameOkrug:
      type: object
      required: [okrug, streets, matched, lengthKm]
      properties:
        okrug: { type: string }
        streets: { type: integer }
        matched: { type: integer }
        lengthKm: { type: number }

    PassStats:
      type: object
      required: [series]
      properties:
        updatedAt: { type: string, format: date-time }
        series:
          type: array
          items: { $ref: "#/components/schemas/PassSeries" }

    PassSeries:
      type: object
      required: [zone, series, metric, points]
      properties:
        zone: { type: string }
        series: { type: string }
        metric:
          type: string
          enum: [valid, issued, cancelled]
          description: valid — действующих на первое число; issued — начавших действовать в месяце; cancelled — аннулированных
        points:
          type: array
          items: { $ref: "#/components/schemas/MonthValue" }

    MonthValue:
      type: object
      required: [month, value]
      properties:
        month: { type: string, format: date }
        value: { type: integer }

    PermitStats:
      type: object
      required: [total, months, exceeded]
      properties:
        updatedAt: { type: string, format: date-time }
        total: { type: integer }
        months:
          type: array
          description: Выдано разрешений по месяцам
          items: { $ref: "#/components/schemas/MonthValue" }
        exceeded:
          type: array
          description: Разрешения по превышенному параметру (масса более 40 т, ширина более 2,55 м, высота более 4 м, длина более 20 м); одно разрешение может превышать несколько
          items: { $ref: "#/components/schemas/NamedCount" }

    NamedCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }

    SignQuality:
      type: object
      required: [active, restrictionSigns, matched, ambiguous, unmatched, restrictions, types, conflicts]
      properties:
        updatedAt: { type: string, format: date-time }
        active:
          type: integer
          description: Знаков в реестре (действующих)
        restrictionSigns:
          type: integer
          description: Знаков ограничений для грузового движения
        matched: { type: integer }
        ambiguous: { type: integer }
        unmatched: { type: integer }
        restrictions:
          type: integer
          description: Ограничений на участках, полученных из знаков
        types:
          type: array
          items: { $ref: "#/components/schemas/SignTypeQuality" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ConflictCount" }

    SignTypeQuality:
      type: object
      required: [code, name, kind, count, matched, ambiguous, unmatched]
      properties:
        code: { type: string }
        name: { type: string }
        kind: { type: string }
        count: { type: integer }
        matched: { type: integer }
        ambiguous: { type: integer }
        unmatched: { type: integer }

    ConflictCount:
      type: object
      required: [type, kind, segments]
      properties:
        type:
          type: string
          enum: [sign_not_in_osm, osm_not_signed]
          description: sign_not_in_osm — знак есть, в OSM ограничения нет; osm_not_signed — в OSM есть, знака рядом нет
        kind: { type: string }
        segments: { type: integer }

    VehicleProfile:
      type: object
      required: [code, name, grossT, payloadT, axleLoadT, heightM, widthM, lengthM, ecoClass, hazmat]
      properties:
        code: { type: string }
        name: { type: string }
        grossT:
          type: number
          description: Разрешённая максимальная масса, т
        payloadT:
          type: number
          description: Грузоподъёмность, т
        axleLoadT: { type: number }
        heightM: { type: number }
        widthM: { type: number }
        lengthM: { type: number }
        ecoClass:
          type: integer
          description: Экологический класс (0 — не указан)
        hazmat: { type: boolean }

    VehicleParams:
      type: object
      required: [grossT, heightM, widthM, lengthM]
      properties:
        grossT: { type: number, minimum: 0.5, maximum: 100 }
        payloadT: { type: number, minimum: 0, maximum: 80 }
        axleLoadT: { type: number, minimum: 0, maximum: 20 }
        heightM: { type: number, minimum: 1, maximum: 6 }
        widthM: { type: number, minimum: 1, maximum: 4 }
        lengthM: { type: number, minimum: 2, maximum: 30 }
        ecoClass: { type: integer, minimum: 0, maximum: 6 }
        hazmat: { type: boolean }

    LngLat:
      type: object
      required: [lon, lat]
      properties:
        lon: { type: number, minimum: -180, maximum: 180 }
        lat: { type: number, minimum: -85, maximum: 85 }

    VehiclePass:
      type: object
      required: [zone, kind]
      properties:
        zone:
          type: string
          enum: [sk, ttk, mkad]
        kind:
          type: string
          enum: [day, night]

    RouteRequest:
      type: object
      required: [points, vehicle]
      properties:
        points:
          type: array
          minItems: 2
          maxItems: 25
          items: { $ref: "#/components/schemas/LngLat" }
        vehicle: { $ref: "#/components/schemas/VehicleParams" }
        passes:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/VehiclePass" }
        depart:
          type: string
          format: date-time
          description: Время отправления; нет — сейчас
        alternates: { type: integer, minimum: 0, maximum: 2 }

    RouteLine:
      type: object
      required: [timeS, lengthKm, coordinates]
      properties:
        timeS: { type: number }
        lengthKm: { type: number }
        coordinates:
          type: array
          description: Линия маршрута [долгота, широта]
          items:
            type: array
            items: { type: number }

    ZoneRuleUse:
      type: object
      required: [code, title, blocking, confirmed]
      properties:
        code: { type: string }
        title: { type: string }
        blocking:
          type: boolean
          description: Правило закрывает зону для этого ТС
        confirmed: { type: boolean }
        basis: { type: string }
        note:
          type: string
          enum: [eco_unknown, payload_unknown]
          description: eco_unknown — экологический класс не указан (зону не закрывает); payload_unknown — грузоподъёмность не указана, считается выше порога

    ZoneVerdict:
      type: object
      required: [zone, forbidden, unconfirmed, rules]
      properties:
        zone:
          type: string
          enum: [sk, ttk, mkad]
        forbidden: { type: boolean }
        unconfirmed:
          type: boolean
          description: Решение опирается на неподтверждённое правило
        rules:
          type: array
          items: { $ref: "#/components/schemas/ZoneRuleUse" }

    AvoidedRestriction:
      type: object
      required: [kind, street, origins, segments, lengthM]
      properties:
        kind: { type: string }
        street: { type: string }
        value: { type: number }
        origins:
          type: array
          items: { type: string }
        segments: { type: integer }
        lengthM: { type: number }

    BlockedPoint:
      type: object
      required: [index, zone]
      properties:
        index: { type: integer }
        zone:
          type: string
          enum: [sk, ttk, mkad]

    RouteResult:
      type: object
      required: [routes, zones, blocked, avoided, avoidedZones]
      properties:
        routes:
          type: array
          items: { $ref: "#/components/schemas/RouteLine" }
        baseline: { $ref: "#/components/schemas/RouteLine" }
        zones:
          type: array
          items: { $ref: "#/components/schemas/ZoneVerdict" }
        blocked:
          type: array
          items: { $ref: "#/components/schemas/BlockedPoint" }
        avoided:
          type: array
          items: { $ref: "#/components/schemas/AvoidedRestriction" }
        avoidedZones:
          type: array
          items:
            type: string
            enum: [sk, ttk, mkad]

    RoutingStatus:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        version: { type: string }
        graphBuiltAt: { type: string, format: date-time }

    CentralityAccuracy:
      type: object
      required: [sources, exact]
      properties:
        sources: { type: integer, description: "Узлов-источников в выборке" }
        exact: { type: boolean, description: "Источники — все узлы графа" }
        rse: { type: number, description: "Медиана относительной стандартной ошибки по верхней сотне участков" }
        splitHalf: { type: number, description: "Ранговая корреляция Спирмена оценок двух половин выборки" }

    StreetRank:
      type: object
      required: [name, share, rank, topKm, point]
      properties:
        name: { type: string }
        share: { type: number, description: "Наибольшая доля путей через участок улицы, %" }
        rank: { type: integer, description: "Лучшее место участка улицы в рейтинге" }
        topKm: { type: number, description: "Длина участков улицы в верхних 5 %, км" }
        point: { $ref: "#/components/schemas/LngLat" }

    NetworkBottleneck:
      type: object
      required: [segmentId, name, kind, freeRank, freeShare, point, segments]
      properties:
        segmentId: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          enum: [maxheight, maxweight, maxaxleload, maxwidth, maxlength]
        value: { type: number, description: "Величина предела, т или м" }
        freeRank: { type: integer, description: "Место участка в рейтинге значимости без пределов габаритов" }
        freeShare: { type: number, description: "Доля путей, которые шли бы через участок без предела, %" }
        detourMinutes: { type: number, description: "Дополнительное время объезда, мин; нет — объезда нет" }
        point: { $ref: "#/components/schemas/LngLat" }
        segments: { type: integer, description: "Линий OSM улицы с тем же пределом (показана самая значимая)" }

    ElementDamage:
      type: object
      required: [facilities, minutes, maxDelay, disconnected]
      properties:
        facilities: { type: integer, description: "Объектов с приростом времени до МКАД" }
        minutes: { type: number, description: "Суммарный прирост, объекто-минуты" }
        maxDelay: { type: number, description: "Наибольший прирост, мин" }
        disconnected: { type: integer, description: "Объектов, теряющих доступ к МКАД" }

    CriticalElement:
      type: object
      required: [id, kind, name, rank, graph, point, same]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [bridge, segment] }
        name: { type: string }
        rank: { type: integer }
        graph: { $ref: "#/components/schemas/ElementDamage" }
        valhalla: { $ref: "#/components/schemas/ElementDamage" }
        point: { $ref: "#/components/schemas/LngLat" }
        same: { type: integer, description: "Элементов той же дороги с тем же эффектом (показан первый)" }

    CriticalityStats:
      type: object
      required: [facilities, facilitiesSnapped, targets, targetsSnapped, elements, bridges, confirmed]
      properties:
        facilities: { type: integer }
        facilitiesSnapped: { type: integer, description: "Объектов, привязанных к графу в 500 м" }
        targets: { type: integer, description: "Точек МКАД" }
        targetsSnapped: { type: integer }
        elements: { type: integer, description: "Оценённых элементов" }
        bridges: { type: integer }
        confirmed: { type: integer, description: "Проверено матрицами Valhalla" }

    NetworkAnalysis:
      type: object
      required:
        - version
        - profile
        - builtAt
        - nodes
        - edges
        - arcs
        - largestComponent
        - accuracy
        - freeAccuracy
        - durationSeconds
        - topStreets
        - bottlenecks
        - bottleneckCount
        - noDetourCount
        - criticality
        - critical
      properties:
        version: { type: integer }
        profile: { type: string, description: "Профиль ТС анализа" }
        builtAt: { type: string, format: date-time }
        nodes: { type: integer }
        edges: { type: integer }
        arcs: { type: integer, description: "Направлений проезда, открытых профилю" }
        largestComponent: { type: number, description: "Доля узлов в наибольшей сильно связной компоненте" }
        accuracy: { $ref: "#/components/schemas/CentralityAccuracy" }
        freeAccuracy: { $ref: "#/components/schemas/CentralityAccuracy" }
        durationSeconds: { type: number }
        topStreets:
          type: array
          items: { $ref: "#/components/schemas/StreetRank" }
        bottlenecks:
          type: array
          items: { $ref: "#/components/schemas/NetworkBottleneck" }
        bottleneckCount: { type: integer, description: "Участков OSM — узких мест" }
        noDetourCount: { type: integer, description: "Из них без объезда" }
        criticality: { $ref: "#/components/schemas/CriticalityStats" }
        critical:
          type: array
          items: { $ref: "#/components/schemas/CriticalElement" }

    MatrixRequest:
      type: object
      required: [sources, targets, vehicle]
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/LngLat" }
        targets:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/LngLat" }
        vehicle: { $ref: "#/components/schemas/VehicleParams" }
        passes:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/VehiclePass" }
        depart: { type: string, format: date-time }

    MatrixCell:
      type: object
      description: "Пустая ячейка — пути нет"
      properties:
        timeS: { type: number }
        lengthKm: { type: number }

    MatrixResult:
      type: object
      required: [rows, zones, blockedSources, blockedTargets]
      properties:
        rows:
          type: array
          description: "Строка — источник, столбец — цель"
          items:
            type: array
            items: { $ref: "#/components/schemas/MatrixCell" }
        zones:
          type: array
          items: { $ref: "#/components/schemas/ZoneVerdict" }
        blockedSources:
          type: array
          items: { $ref: "#/components/schemas/BlockedPoint" }
        blockedTargets:
          type: array
          items: { $ref: "#/components/schemas/BlockedPoint" }

    IsochroneRequest:
      type: object
      required: [origin, vehicle, minutes]
      properties:
        origin: { $ref: "#/components/schemas/LngLat" }
        vehicle: { $ref: "#/components/schemas/VehicleParams" }
        passes:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/VehiclePass" }
        depart: { type: string, format: date-time }
        minutes:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: integer, minimum: 5, maximum: 120 }

    IsochroneContour:
      type: object
      required: [minutes, geometry]
      properties:
        minutes: { type: integer }
        geometry:
          type: object
          description: Многоугольник GeoJSON
          additionalProperties: {}

    IsochroneResult:
      type: object
      required: [contours, zones]
      properties:
        contours:
          type: array
          items: { $ref: "#/components/schemas/IsochroneContour" }
        zones:
          type: array
          items: { $ref: "#/components/schemas/ZoneVerdict" }
        blocked: { $ref: "#/components/schemas/BlockedPoint" }
