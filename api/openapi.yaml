openapi: 3.0.3
info:
  title: FreightFlow API
  version: 1.0.0
  description: |
    Программный интерфейс системы мониторинга и анализа логистической инфраструктуры Москвы.
    Доступ — по сессии браузера или по токену (`Authorization: Bearer <токен>`).
    Право доступа операции указано в расширении `x-permission`; `authenticated` — любой вошедший
    пользователь.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: me
    description: Текущий пользователь
  - name: admin
    description: Администрирование

paths:
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Текущий пользователь и его права
      x-permission: authenticated
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Изменить имя
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfile" }
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }

  /me/settings:
    get:
      tags: [me]
      operationId: getSettings
      summary: Личные настройки
      x-permission: authenticated
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [me]
      operationId: updateSettings
      summary: Сохранить личные настройки
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Problem" }

  /me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Сменить пароль
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePassword" }
      responses:
        "204": { description: Пароль изменён }
        default: { $ref: "#/components/responses/Problem" }

  /me/totp:
    post:
      tags: [me]
      operationId: beginTotpSetup
      summary: Начать подключение двухфакторной защиты
      x-permission: authenticated
      responses:
        "200":
          description: Секрет и ссылка для приложения-аутентификатора
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [me]
      operationId: disableTotp
      summary: Отключить двухфакторную защиту
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "204": { description: Отключено }
        default: { $ref: "#/components/responses/Problem" }

  /me/totp/confirm:
    post:
      tags: [me]
      operationId: confirmTotp
      summary: Подтвердить подключение кодом из приложения
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: Резервные коды (показываются один раз)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Problem" }

  /me/tokens:
    get:
      tags: [me]
      operationId: listTokens
      summary: Токены API пользователя
      x-permission: tokens.own
      responses:
        "200":
          description: Токены
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [me]
      operationId: createToken
      summary: Выпустить токен API
      x-permission: tokens.own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToken" }
      responses:
        "201":
          description: Токен; значение показывается один раз
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        default: { $ref: "#/components/responses/Problem" }

  /me/tokens/{tokenId}:
    delete:
      tags: [me]
      operationId: revokeToken
      summary: Отозвать токен
      x-permission: tokens.own
      parameters:
        - $ref: "#/components/parameters/TokenId"
      responses:
        "204": { description: Отозван }
        default: { $ref: "#/components/responses/Problem" }

  /permissions:
    get:
      tags: [me]
      operationId: listPermissions
      summary: Справочник прав
      x-permission: authenticated
      responses:
        "200":
          description: Права
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PermissionInfo" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Пользователи
      x-permission: users.manage
      responses:
        "200":
          description: Пользователи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      operationId: createUser
      summary: Создать пользователя
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "201":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/users/{userId}:
    get:
      tags: [admin]
      operationId: getUser
      summary: Пользователь
      x-permission: users.manage
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [admin]
      operationId: updateUser
      summary: Изменить имя, роли или статус
      x-permission: users.manage
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/users/{userId}/totp:
    delete:
      tags: [admin]
      operationId: resetUserTotp
      summary: Сбросить двухфакторную защиту пользователя
      x-permission: users.manage
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Сброшено }
        default: { $ref: "#/components/responses/Problem" }

  /admin/invites:
    post:
      tags: [admin]
      operationId: createInvite
      summary: Пригласить пользователя
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvite" }
      responses:
        "201":
          description: Приглашение отправлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: Роли и права
      x-permission: users.manage
      responses:
        "200":
          description: Роли
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/audit:
    get:
      tags: [admin]
      operationId: listAudit
      summary: Журнал аудита
      x-permission: audit.view
      parameters:
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: cursor
          in: query
          description: Идентификатор последней записи предыдущей страницы
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Страница записей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ff_session
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Ошибка (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    Me:
      type: object
      required: [id, email, name, roles, permissions, totpEnabled]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        totpEnabled: { type: boolean }

    UpdateProfile:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    Settings:
      type: object
      required: [theme]
      properties:
        theme:
          type: string
          enum: [light, dark, system]

    ChangePassword:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }

    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128 }

    TotpSetup:
      type: object
      required: [secret, url]
      properties:
        secret: { type: string }
        url: { type: string }

    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 11 }

    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }

    PermissionInfo:
      type: object
      required: [code, title]
      properties:
        code: { type: string }
        title: { type: string }

    ApiToken:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }

    CreateToken:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
        expiresAt: { type: string, format: date-time }

    CreatedToken:
      type: object
      required: [token, value]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        value: { type: string }

    User:
      type: object
      required: [id, email, name, status, roles, totpEnabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [active, blocked]
        roles:
          type: array
          items: { type: string }
        totpEnabled: { type: boolean }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    CreateUser:
      type: object
      required: [email, name, password, roles]
      properties:
        email: { type: string, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 128 }
        roles:
          type: array
          minItems: 1
          items: { type: string }

    UpdateUser:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        roles:
          type: array
          minItems: 1
          items: { type: string }
        status:
          type: string
          enum: [active, blocked]

    CreateInvite:
      type: object
      required: [email, role]
      properties:
        email: { type: string, maxLength: 254 }
        role: { type: string }

    InviteCreated:
      type: object
      required: [email, expiresInHours]
      properties:
        email: { type: string }
        expiresInHours: { type: integer }

    Role:
      type: object
      required: [code, name, description, builtin, permissions]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        builtin: { type: boolean }
        permissions:
          type: array
          items: { type: string }

    AuditRecord:
      type: object
      required: [id, at, actorLabel, action, entityType, entityId, details]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorId: { type: string, format: uuid }
        actorLabel: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        ip: { type: string }
        userAgent: { type: string }
        details:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditRecord" }
        nextCursor: { type: string, format: uuid }
