version: "3"

vars:
  COMPOSE: docker compose -f deploy/compose.dev.yaml
  BIN: bin/freightflow{{exeExt}}

dotenv: [".env"]

# Загрузки модулей Go и пакетов идут напрямую: через системный прокси они в десятки раз медленнее.
env:
  HTTP_PROXY: ""
  HTTPS_PROXY: ""

tasks:
  up:
    desc: Запустить службы разработки (БД, почта)
    cmds:
      - "{{.COMPOSE}} up -d --build db mailpit"

  down:
    desc: Остановить службы разработки
    cmds:
      - "{{.COMPOSE}} down"

  logs:
    desc: Журналы служб разработки
    cmds:
      - "{{.COMPOSE}} logs -f --tail=100"

  build:
    desc: Собрать бинарник
    cmds:
      - go build -ldflags "-X freightflow/internal/app.Version={{.VERSION}}" -o {{.BIN}} ./cmd/freightflow
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev

  build:linux:
    desc: Собрать бинарник для контейнера worker
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - go build -ldflags "-X freightflow/internal/app.Version={{.VERSION}}" -o bin/linux/freightflow ./cmd/freightflow
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev

  etl:image:
    desc: Собрать образ worker с инструментами OSM
    deps: [build:linux]
    cmds:
      - "{{.COMPOSE}} --profile etl build worker"

  etl:up:
    desc: Запустить worker в контейнере (очереди с инструментами OSM)
    deps: [build:linux]
    cmds:
      - "{{.COMPOSE}} --profile etl up -d worker"

  routing:prepare:
    desc: Наложить ограничения из знаков на выгрузку маршрутизации (контейнер worker)
    deps: [build:linux]
    cmds:
      - "{{.COMPOSE}} --profile etl run --rm worker routing prepare"

  routing:build:
    desc: Собрать граф Valhalla и переключить на него службу маршрутизации
    deps: [routing:prepare]
    cmds:
      - "{{.COMPOSE}} --profile routing run --rm --no-deps --entrypoint /bin/bash routing /opt/valhalla/build.sh"
      - "{{.COMPOSE}} --profile routing up -d --force-recreate routing"

  routing:up:
    desc: Запустить службу маршрутизации (граф — task routing:build)
    cmds:
      - "{{.COMPOSE}} --profile routing up -d routing"

  etl:run:
    desc: "Загрузить источник в контейнере worker: task etl:run SOURCE=osm [FORCE=1]"
    deps: [build:linux]
    requires:
      vars: [SOURCE]
    cmds:
      - "{{.COMPOSE}} --profile etl run --rm worker etl run {{if .FORCE}}-force {{end}}{{.SOURCE}}"

  etl:list:
    desc: Источники данных и последние запуски
    deps: [build]
    cmds:
      - "{{.BIN}} etl list"

  serve:
    desc: Запустить веб-сервер (в разработке — вместе с фоновыми задачами)
    deps: [build]
    cmds:
      - "{{.BIN}} serve"

  worker:
    desc: Запустить отдельный процесс фоновых задач
    deps: [build]
    cmds:
      - "{{.BIN}} worker"

  dev:
    desc: "Разработка: службы Docker, сервер (8080) и Vite (5173) — открывать http://localhost:5173"
    cmds:
      - task: up
      - task: dev:run

  dev:run:
    internal: true
    deps: [serve, web:dev]

  db:migrate:
    desc: Применить миграции
    deps: [build]
    cmds:
      - "{{.BIN}} migrate up"

  db:status:
    desc: Состояние миграций
    deps: [build]
    cmds:
      - "{{.BIN}} migrate status"

  db:reset:
    desc: Пересоздать базу разработки (данные будут удалены)
    prompt: База разработки будет удалена. Продолжить?
    cmds:
      - "{{.COMPOSE}} down db"
      - docker volume rm ffv2-dev_pgdata
      - task: up

  fmt:
    desc: Форматирование кода
    env:
      GOLANGCI_LINT_CACHE: "{{.ROOT_DIR}}/tmp/golangci-cache"
    cmds:
      - golangci-lint fmt ./...

  lint:
    desc: Линтеры
    env:
      GOLANGCI_LINT_CACHE: "{{.ROOT_DIR}}/tmp/golangci-cache"
    cmds:
      - golangci-lint run ./...

  test:
    desc: Тесты Go (интеграционные — на базе из `task up`)
    env:
      FF_TEST_REQUIRE_DB: "1"
    cmds:
      - go test ./...

  gen:
    desc: "Генерация кода: запросы БД, сервер и клиент API, шаблоны страниц"
    cmds:
      - cmd: sqlc generate
        dir: db
      - go tool ogen --target internal/api/gen --package gen --clean api/openapi.yaml
      - go tool templ generate
      - cmd: npm run gen:api
        dir: web

  web:install:
    desc: Установить зависимости фронтенда
    dir: web
    cmds:
      - npm ci

  web:dev:
    desc: Сервер разработки фронтенда (Vite, порт 5173; API — через `task serve`)
    dir: web
    cmds:
      - npm run dev

  web:build:
    desc: Сборка фронтенда в web/dist (встраивается в бинарник)
    dir: web
    cmds:
      - npm run build

  web:lint:
    desc: Проверка типов и линтер фронтенда
    dir: web
    cmds:
      - npm run typecheck
      - npm run lint

  web:test:
    desc: Тесты компонентов фронтенда
    dir: web
    cmds:
      - npm test

  e2e:
    desc: "Сквозные тесты в браузере (нужны `task serve` и `task web:dev`); файл: task e2e -- data.spec.ts"
    dir: web
    cmds:
      - npx playwright test {{.CLI_ARGS}}

  vuln:
    desc: Проверка уязвимостей в зависимостях
    cmds:
      - govulncheck ./...

  check:
    desc: Полная проверка перед коммитом
    cmds:
      - task: lint
      - task: web:lint
      - task: test
      - task: web:test
      - task: web:build
      - task: build
      - task: vuln
