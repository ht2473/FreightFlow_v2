version: "3"

vars:
  COMPOSE: docker compose -f deploy/compose.dev.yaml
  BIN: bin/freightflow{{exeExt}}

dotenv: [".env"]

# Загрузки модулей Go и пакетов идут напрямую: через системный прокси они в десятки раз медленнее.
env:
  HTTP_PROXY: ""
  HTTPS_PROXY: ""

tasks:
  up:
    desc: Запустить службы разработки (БД, почта)
    cmds:
      - "{{.COMPOSE}} up -d --build db mailpit"

  down:
    desc: Остановить службы разработки
    cmds:
      - "{{.COMPOSE}} down"

  logs:
    desc: Журналы служб разработки
    cmds:
      - "{{.COMPOSE}} logs -f --tail=100"

  build:
    desc: Собрать бинарник
    cmds:
      - go build -ldflags "-X freightflow/internal/app.Version={{.VERSION}}" -o {{.BIN}} ./cmd/freightflow
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev

  serve:
    desc: Запустить веб-сервер
    deps: [build]
    cmds:
      - "{{.BIN}} serve"

  db:migrate:
    desc: Применить миграции
    deps: [build]
    cmds:
      - "{{.BIN}} migrate up"

  db:status:
    desc: Состояние миграций
    deps: [build]
    cmds:
      - "{{.BIN}} migrate status"

  db:reset:
    desc: Пересоздать базу разработки (данные будут удалены)
    prompt: База разработки будет удалена. Продолжить?
    cmds:
      - "{{.COMPOSE}} down db"
      - docker volume rm ffv2-dev_pgdata
      - task: up

  fmt:
    desc: Форматирование кода
    env:
      GOLANGCI_LINT_CACHE: "{{.ROOT_DIR}}/tmp/golangci-cache"
    cmds:
      - golangci-lint fmt ./...

  lint:
    desc: Линтеры
    env:
      GOLANGCI_LINT_CACHE: "{{.ROOT_DIR}}/tmp/golangci-cache"
    cmds:
      - golangci-lint run ./...

  test:
    desc: Тесты Go (интеграционные — на базе из `task up`)
    env:
      FF_TEST_REQUIRE_DB: "1"
    cmds:
      - go test ./...

  gen:
    desc: "Генерация кода: запросы БД, сервер и клиент API, шаблоны страниц"
    cmds:
      - cmd: sqlc generate
        dir: db
      - go tool ogen --target internal/api/gen --package gen --clean api/openapi.yaml
      - go tool templ generate
      - cmd: npm run gen:api
        dir: web

  web:install:
    desc: Установить зависимости фронтенда
    dir: web
    cmds:
      - npm ci

  web:dev:
    desc: Сервер разработки фронтенда (Vite, порт 5173; API — через `task serve`)
    dir: web
    cmds:
      - npm run dev

  web:build:
    desc: Сборка фронтенда в web/dist (встраивается в бинарник)
    dir: web
    cmds:
      - npm run build

  web:lint:
    desc: Проверка типов и линтер фронтенда
    dir: web
    cmds:
      - npm run typecheck
      - npm run lint

  web:test:
    desc: Тесты компонентов фронтенда
    dir: web
    cmds:
      - npm test

  e2e:
    desc: Сквозные тесты в браузере (нужны `task serve` и `task web:dev`)
    dir: web
    cmds:
      - npx playwright test

  vuln:
    desc: Проверка уязвимостей в зависимостях
    cmds:
      - govulncheck ./...

  check:
    desc: Полная проверка перед коммитом
    cmds:
      - task: lint
      - task: web:lint
      - task: test
      - task: web:test
      - task: web:build
      - task: build
      - task: vuln
