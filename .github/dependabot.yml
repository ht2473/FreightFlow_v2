version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Go:"
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Интерфейс:"
    groups:
      web-minor:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript 7 требует typescript ^5; снять, когда появится поддержка новых версий.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "CI:"
    groups:
      actions:
        update-types: [major, minor, patch]

  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Образы:"
