version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Go:"
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Интерфейс:"
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "CI:"
    groups:
      actions:
        update-types: [major, minor, patch]

  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Образы:"
