version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sqlclosecheck
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # необработанные ошибки проверяет errcheck
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: false
    misspell:
      locale: US
  exclusions:
    generated: strict
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - internal/api/gen
      - internal/.*/sqlc
      - _templ\.go$
    rules:
      - path: _test\.go
        linters: [gosec, unparam, noctx, bodyclose]
      # Компоненты templ получают контекст при отрисовке (Render(ctx, w)), а не при создании.
      - path: internal/web/
        linters: [contextcheck]

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gofumpt:
      module-path: freightflow
    gci:
      sections:
        - standard
        - default
        - localmodule
